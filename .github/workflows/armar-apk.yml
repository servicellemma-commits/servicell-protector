name: Armar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  armar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Revisar que el codigo compile
        shell: bash
        run: |
          set -o pipefail
          if ! gradle compileReleaseKotlin --no-daemon 2>&1 | tee compilar.log; then
            grep -E "^e: |error:|FAILURE" compilar.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Preparar datos secretos
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CLAVE_SECRETA: ${{ secrets.CLAVE_SECRETA }}
        run: |
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD CLAVE_SECRETA; do
            if [ -z "${!n}" ]; then echo "::error::Falta el secreto $n"; exit 1; fi
          done
          # Se quitan espacios o saltos de linea que se cuelan al pegar desde el celular
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > app/servicell.jks 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 esta mal pegado (no se pudo leer)"; exit 1
          fi
          if ! keytool -list -keystore app/servicell.jks -storepass "$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD no coincide con KEYSTORE_BASE64 (o la firma esta incompleta)"; exit 1
          fi

      - name: Compilar la app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CLAVE_SECRETA: ${{ secrets.CLAVE_SECRETA }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk ServicellProtector.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ServicellProtector
          path: ServicellProtector.apk

      - name: Publicar la ultima version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima ServicellProtector.apk \
            --title "Ultima version" \
            --notes "APK listo para instalar en el celular del cliente."

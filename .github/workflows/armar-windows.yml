name: Armar programa Windows

on:
  push:
    branches: [main]
    paths:
      - 'pc/**'
      - '.github/workflows/armar-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  armar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller y el lector de apps
        run: pip install pyinstaller pyaxmlparser

      - name: Bajar ADB (herramienta oficial de Google)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pc

      - name: Bajar la ultima app Android (para instalarla al cliente)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ultima --repo ${{ github.repository }} --pattern "ServicellProtector.apk" --dir pc --clobber
          if (-not (Test-Path "pc/ServicellProtector.apk")) { Write-Error "No se pudo bajar la app"; exit 1 }

      - name: Probar que lee el nombre real de una app
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'pc'); import servicell_pc as s; r = s.leer_apk('pc/ServicellProtector.apk'); print('Nombre:', r['nombre']); print('Pantalla principal:', r['principal']); print('Componentes:', len(r['componentes'])); assert r['nombre'] == 'Servicell Protector', r; assert r['principal'], r; assert r['componentes'], r"

      - name: Armar el .exe
        working-directory: pc
        shell: pwsh
        run: |
          $apk = ""
          if (Test-Path "ServicellProtector.apk") { $apk = "--add-data `"ServicellProtector.apk;.`"" }
          $cmd = "pyinstaller --noconfirm --onefile --windowed --name ServicellProtectorPC " +
                 "--collect-all pyaxmlparser --add-data `"platform-tools;platform-tools`" $apk servicell_pc.py"
          Write-Host $cmd
          Invoke-Expression $cmd

      - name: Probar el .exe armado
        shell: pwsh
        run: |
          Start-Process -FilePath "pc/dist/ServicellProtectorPC.exe" -ArgumentList "--autoprueba", "$PWD\prueba.json" -Wait
          $r = Get-Content prueba.json | ConvertFrom-Json
          $r | Format-List
          if (-not $r.adb_existe) { Write-Error "El programa no encuentra el ADB"; exit 1 }
          if (-not $r.apk) { Write-Error "El programa no encuentra la app para instalar"; exit 1 }
          if (-not $r.lector_apps) { Write-Error "Falta el lector de apps"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ServicellProtectorPC
          path: pc/dist/ServicellProtectorPC.exe

      - name: Publicar en Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc --yes --cleanup-tag 2>$null
          gh release create pc pc/dist/ServicellProtectorPC.exe --title "Programa para Windows" --notes "Herramienta del tecnico: limpia el celular por cable e instala la app."
